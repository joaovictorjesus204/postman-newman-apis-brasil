name: Testes de API (Newman)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Dias úteis, 9h de Brasília
    - cron: '0 12 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Rodar as coleções (APIs e bancadas)
        # No CI, as requisições da Câmara são puladas: a API não responde a acessos de fora do Brasil.
        run: npm run test:ci

      - name: Página dos relatórios
        if: always()
        run: cp reports/report.html reports/index.html

      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-newman
          path: reports

      - name: Preparar publicação
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: reports

  deploy-report:
    needs: test
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
